name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are allowed to finish rather than
# being cancelled, so a half-uploaded artifact is never what gets published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately. The theme and config use APIs this site was verified
      # against; `paginate` in config.toml, for one, is removed in Hugo 0.146+.
      HUGO_VERSION: 0.101.0
    steps:
      - name: Check out
        uses: actions/checkout@v4
        # The theme is vendored in-tree, not a submodule, so no recursive checkout.

      - name: Install Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # base_url has no trailing slash; Hugo wants one.
        # publishDir = "docs" comes from config.toml.
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
