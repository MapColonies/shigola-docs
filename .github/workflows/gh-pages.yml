name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - master

  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Required because the deployment action writes to the gh-pages branch.
permissions:
  contents: write

# Prevent multiple production deployments from running at the same time.
concurrency:
  group: gh-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build

          # PR previews are stored here by rossjrw/pr-preview-action.
          # Production deployments must not delete them.
          clean-exclude: pr-preview

          # Do not force-push gh-pages because that would destroy
          # preview deployments created by PR workflows.
          force: false
